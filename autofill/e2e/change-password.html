<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Change Password</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
<!--
  Used by automated end-to-end tests. They find elements by label text, id and button text,
  so the form and its values must stay on the page after submit.
  There is no username field on purpose: tests check that autofill uses a username from an earlier form.
-->
<p><a href="../../index.html#autofill">[Home]</a></p>
<div class="dialog">
  <h2>Change Password</h2>
  <form id="change-password-form" action="/autofill/e2e/change-password.html" novalidate>
    <fieldset>
      <label for="new-password">New Password</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password">
      <button type="submit">Change Password</button>
    </fieldset>
  </form>
  <p id="result" role="status"></p>
</div>
<script>
  const changePasswordForm = document.getElementById('change-password-form');
  let changePasswordSubmissions = 0;
  changePasswordForm.addEventListener('submit', (e) => {
      e.preventDefault();
      changePasswordSubmissions++;
      document.getElementById('result').textContent = `Submitted ${changePasswordSubmissions} time(s)`;
  });
</script>
</body>
</html>
