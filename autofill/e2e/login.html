<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Login</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
<!--
  Used by automated end-to-end tests. They find elements by label text, id and button text,
  and submit the same form more than once, so the form and its values must stay on the page after submit.
-->
<p><a href="../../index.html#autofill">[Home]</a></p>
<div class="dialog">
  <h2>Login</h2>
  <form id="login-form" action="/autofill/e2e/login.html" novalidate>
    <fieldset>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Login</button>
    </fieldset>
  </form>
  <p id="result" role="status"></p>
</div>
<script>
  const loginForm = document.getElementById('login-form');
  let loginSubmissions = 0;
  loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginSubmissions++;
      document.getElementById('result').textContent = `Submitted ${loginSubmissions} time(s)`;
  });
</script>
</body>
</html>
