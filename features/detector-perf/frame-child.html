<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>detectorPerf — frame child</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; margin: 0; padding: 8px; }
        .origin { font-weight: 600; background: #eef; padding: 4px 6px; border-radius: 4px; display: inline-block; }
        .note { color: #777; font-size: 11px; margin: 4px 0; }
        p { margin: 4px 0; color: #333; }
    </style>
</head>
<body>
    <div class="origin" id="origin"></div>
    <p class="note">No overlay here: detectors are top-frame-only by default and no config opts them into
        subframes, so nothing is ever measured in this frame. Its DOM still adds to the C-S-S injection
        footprint of the parent page.</p>
    <div id="filler"></div>

    <script>
        document.getElementById('origin').textContent = `frame origin: ${location.origin}`;

        // Same near-miss filler as the heavy page: makes the text scanners do
        // full work in this frame without ever producing a match.
        const NEAR_MISS = [
            'ad blocking preferences were detected for this account',
            'please adjust your advertising settings to continue reading',
            'you are using an ad supported plan on this device',
            'turn on notifications for your ad free subscription',
            'your ad experience is on and cannot be changed here',
        ];
        const filler = document.getElementById('filler');
        const count = Number(new URLSearchParams(location.search).get('paragraphs')) || 600;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
            const p = document.createElement('p');
            p.textContent = `${NEAR_MISS[i % NEAR_MISS.length]} (row ${i})`;
            fragment.appendChild(p);
        }
        filler.appendChild(fragment);
    </script>
</body>
</html>
