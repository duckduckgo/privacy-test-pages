<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="referrer" content="unsafe-url">
  <title>Privacy Test Pages - Opt-out forwarding</title>
</head>
<body>

<h1>Opt-out forwarding</h1>

<p id="status">Nothing to forward. Call this page with a destination in the <code>to</code> parameter.</p>

<script>
(() => {
    const searchParams = new URLSearchParams(location.search);
    const encodedTarget = searchParams.get('to');

    if (!encodedTarget) {
        return;
    }

    const status = document.getElementById('status');
    let destination;

    try {
        destination = new URL(decodeURIComponent(encodedTarget));
    } catch {
        status.textContent = 'That destination is not a URL.';
        return;
    }

    if (destination.protocol !== 'https:' || !destination.pathname.split('/').includes('opt-out')) {
        status.textContent = 'Destination must use HTTPS and contain /opt-out.';
        return;
    }

    searchParams.forEach((value, key) => {
        if (key === 'to') {
            return;
        }
        destination.searchParams.set(key, value);
    });

    const forward = document.createElement('a');
    forward.id = 'forward';
    forward.href = destination.toString();
    forward.textContent = 'Continue';
    status.after(forward);
    status.textContent = 'Ready.';
})();
</script>

</body>
</html>
